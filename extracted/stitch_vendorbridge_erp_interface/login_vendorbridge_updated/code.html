<body class="bg-surface-muted min-h-screen w-full flex items-center justify-center relative overflow-hidden antialiased">
<!-- Subtle Ambient Background -->
<div class="absolute inset-0 pointer-events-none overflow-hidden z-0 flex items-center justify-center">
<div class="absolute top-[-20%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-primary-fixed/30 blur-[140px] opacity-60"></div>
<div class="absolute bottom-[-20%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-secondary-fixed/30 blur-[120px] opacity-40"></div>
</div>
<!-- Login Card Container -->
<main class="relative z-10 w-full max-w-[440px] bg-surface-container-lowest border border-border-subtle shadow-sm rounded-[12px] p-margin-page flex flex-col mx-4">
<!-- Header / Branding -->
<div class="flex flex-col items-center justify-center text-center mb-margin-page">
<div class="w-16 h-16 rounded-full bg-surface-muted border border-border-subtle flex items-center justify-center mb-density-comfortable">
<span class="material-symbols-outlined text-[32px] text-primary" style="font-variation-settings: 'FILL' 1;">admin_panel_settings</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-baseline">VendorBridge</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Enterprise Resource Planning System</p>
</div>
<!-- Authentication Form -->
<form action="#" class="flex flex-col gap-gutter" method="POST" onsubmit="event.preventDefault();">
<!-- Input Group: Username -->
<div class="flex flex-col gap-baseline">
<label class="font-label-caps text-label-caps text-data-ink" for="username">Corporate ID or Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[20px] pointer-events-none">person</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-surface border border-border-subtle rounded-DEFAULT font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="username" name="username" placeholder="Enter your credentials" required="" type="text"/>
</div>
</div>
<!-- Input Group: Password -->
<div class="flex flex-col gap-baseline">
<label class="font-label-caps text-label-caps text-data-ink" for="password">Secure Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[20px] pointer-events-none">lock</span>
<input class="w-full pl-10 pr-12 py-2.5 bg-surface border border-border-subtle rounded-DEFAULT font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 text-outline hover:text-on-surface transition-colors flex items-center justify-center h-full focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Utilities Row -->
<div class="flex items-center justify-between mt-[-8px]">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-border-subtle text-primary bg-surface focus:ring-primary focus:ring-offset-0 focus:outline-none transition-all" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container font-medium transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Action Area -->
<div class="pt-density-compact mt-density-compact border-t border-border-subtle/50">
<button class="w-full bg-primary text-on-primary font-label-bold text-label-bold py-3 px-4 rounded-[12px] hover:bg-primary-container active:bg-primary-fixed-variant transition-colors flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined text-[18px]">login</span>
                    Authenticate Session
                </button>
</div>
</form>
<!-- Footer Note -->
<div class="mt-gutter pt-density-comfortable text-center">
<p class="font-body-sm text-body-sm text-outline flex items-center justify-center gap-1.5">
<span class="material-symbols-outlined text-[14px]">encrypted</span>
                Protected by end-to-end encryption
            </p>
</div>
</main>
<!-- Version Tag -->
<div class="absolute bottom-6 font-data-mono text-label-caps text-outline opacity-50 text-center w-full z-0">
        VB-ERP BUILD v4.2.1-SECURE
    </div>
